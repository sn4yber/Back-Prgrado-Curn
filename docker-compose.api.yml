services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: "5432"
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - db_net

networks:
  db_net:
    external: true
