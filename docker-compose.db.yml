services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: database_Prgrado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d database_Prgrado"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

networks:
  db_net:
    name: db_net
    driver: bridge
